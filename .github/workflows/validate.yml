name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - run: skills-ref validate skills/research-report
      - run: python tools/validate_skill.py
      - run: python -m unittest discover -s tests -v
        env:
          REPORT_RENDER_TESTS: '1'
      - name: Render Linux preview
        if: always()
        run: python skills/research-report/scripts/render_html.py skills/research-report/assets/html/example.html --output-dir build/ci-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-report-preview
          path: build/ci-preview/
          if-no-files-found: warn
          retention-days: 7
